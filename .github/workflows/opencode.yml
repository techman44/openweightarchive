# OpenCode — comment-driven agent.
# Mention /opencode or /oc in an issue or PR comment and OpenCode runs on the
# runner: explains issues, fixes them in a branch + PR, or applies changes to a PR.
# Uses GITHUB_TOKEN mode (no extra GitHub App install needed). Model provider is
# defined in ./opencode.json (LiteLLM gateway); key lives in LITELLM_API_KEY secret.
name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: [self-hosted, Linux, X64, pips-lxc]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: litellm-gh/coding
          use_github_token: true
