name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: pips-lxc
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - name: Require a configured D1 database
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('dist/server/wrangler.json', 'utf8'));
          if (config.d1_databases.find(db => db.binding === 'OWA_DB')?.database_id === '00000000-0000-0000-0000-000000000000') {
            throw new Error('Replace the OWA_DB database_id placeholder in wrangler.jsonc before deploying.');
          }
          JS
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply OWA_DB --remote --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
